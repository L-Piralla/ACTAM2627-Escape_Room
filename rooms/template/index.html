<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO: room title -->
  <title>Stanza N – Titolo della stanza</title>

  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="style.css">

  <script src="../../shared/doodles.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>

  <!-- Doodle background (filled by shared/doodles.js) -->
  <svg id="doodles" aria-hidden="true"></svg>

  <main>
    <!-- Header -->
    <header class="banner">
      <h1>Stanza N: titolo della stanza</h1>
      <p>♪ Sottotitolo ♪</p>
    </header>

    <!-- Intro: story + rules -->
    <section class="card intro">
      <h2>Di cosa si tratta</h2>
      <p>Descrizione del concetto musicale/sonoro su cui si basa la stanza.</p>

      <h2 class="how">Come uscire</h2>
      <ol>
        <li>Primo passo.</li>
        <li>Secondo passo.</li>
        <li>Terzo passo.</li>
      </ol>
    </section>

    <!-- Puzzle: put the room's interactive content here -->
    <section class="card" id="puzzle">
      <h2>L'enigma</h2>
      <div id="puzzle-area"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <!-- Win screen: shown by winRoom() in main.js -->
  <div id="win">
    <div>
      <h2>Porta aperta!</h2>
      <p>Messaggio di vittoria.</p>
      <button class="key go" id="next" type="button">Alla stanza successiva</button>
    </div>
  </div>

</body>
</html>
